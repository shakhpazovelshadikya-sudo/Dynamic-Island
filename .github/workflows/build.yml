name: Build DinamicIslandsetap.exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT; else echo "v=1.0.0" >> $GITHUB_OUTPUT; fi
      - run: dotnet publish DynamicIsland/DynamicIsland.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.v }} -o DynamicIsland/publish
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" DynamicIsland\installer\DynamicIsland.iss /DAppVer=${{ steps.ver.outputs.v }}'
      - run: copy DynamicIsland\publish\DynamicIsland.exe DynamicIsland\installer\Output\
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland
          path: DynamicIsland/installer/Output/*.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DynamicIsland/installer/Output/DinamicIslandsetap.exe
